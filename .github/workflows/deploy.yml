# Publica o site no GitHub Pages a cada push na main.
# O build roda aqui, entao o dist/ nao precisa ir para o repositorio.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez; pushes seguidos cancelam a anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Preparar o dist para o Pages
        run: |
          # O site e uma pagina so: qualquer rota desconhecida devolve o
          # index, senao o Pages mostraria o 404 generico dele.
          cp dist/index.html dist/404.html
          # Sem isso o Pages passa o build pelo Jekyll e ignora arquivos
          # e pastas comecados por underscore.
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
