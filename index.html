<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover libera as safe areas do iPhone; o CSS usa env(). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://danilobossolani.github.io/" />

    <title>Danilo Bossolani · Desenvolvedor Júnior · Java · Spring Boot</title>
    <meta
      name="description"
      content="Desenvolvedor júnior em Java e Spring Boot com PostgreSQL, Node.js e TypeScript. Freelancer desde agosto de 2026, em Sorocaba, SP. Disponível para CLT ou PJ."
    />
    <meta name="author" content="Danilo Yamazaki Bossolani" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="google-site-verification" content="Mvhs5JIxuYz9aZYMb85c_x86aHrqogaxJG6SGuDZTU8" />

    <!-- Diz ao Google quem é a pessoa do site e quais perfis são dela, para
         que a busca pelo nome junte site, LinkedIn e GitHub. Sem telefone:
         o número fica só atrás do botão do WhatsApp. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Danilo Yamazaki Bossolani",
        "alternateName": ["Danilo Bossolani", "Danilo Yamazaki"],
        "jobTitle": "Desenvolvedor Júnior",
        "description": "Desenvolvedor júnior em Java e Spring Boot com PostgreSQL, também com Node.js e TypeScript.",
        "url": "https://danilobossolani.github.io/",
        "email": "mailto:danbossolani@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Sorocaba",
          "addressRegion": "SP",
          "addressCountry": "BR"
        },
        "knowsAbout": ["Java", "Spring Boot", "PostgreSQL", "Node.js", "TypeScript", "Docker"],
        "sameAs": [
          "https://www.linkedin.com/in/danilobossolani",
          "https://github.com/danilobossolani"
        ]
      }
    </script>

    <!-- A barra do navegador no celular acompanha o tema do site. -->
    <meta name="theme-color" content="#0F1513" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-title" content="Danilo Bossolani" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Capa do link compartilhado. As dimensões explícitas evitam que o
         WhatsApp mostre um cartão pequeno enquanto baixa a imagem. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Danilo Bossolani" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://danilobossolani.github.io/" />
    <meta property="og:title" content="Danilo Bossolani · Desenvolvedor Júnior · Java · Spring Boot · IA aplicada" />
    <meta
      property="og:description"
      content="Desenvolvedor júnior em Java e Spring Boot com PostgreSQL, Node.js e TypeScript. Freelancer desde agosto de 2026, em Sorocaba, SP. Disponível para CLT ou PJ."
    />
    <meta property="og:image" content="https://danilobossolani.github.io/og.jpg?v=2" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Danilo Bossolani, desenvolvedor júnior" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Danilo Bossolani · Desenvolvedor Júnior · Java · Spring Boot · IA aplicada" />
    <meta
      name="twitter:description"
      content="Desenvolvedor júnior em Java e Spring Boot com PostgreSQL, Node.js e TypeScript. Freelancer desde agosto de 2026, em Sorocaba, SP. Disponível para CLT ou PJ."
    />
    <meta name="twitter:image" content="https://danilobossolani.github.io/og.jpg?v=2" />


    <script>
      // Aplica tema e idioma antes da primeira pintura, para não haver flash.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = t;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', t === 'dark' ? '#0F1513' : '#FFFFFF');

          // Sempre abre em português (inclusive para o Google); o inglês
          // escolhido no botão vale só enquanto a aba estiver aberta.
          localStorage.removeItem('lang');
          var l = sessionStorage.getItem('lang');
          if (l !== 'pt' && l !== 'en') l = 'pt';
          document.documentElement.lang = l === 'pt' ? 'pt-BR' : 'en';
        } catch (e) {
          /* modo privado: segue com o padrão do HTML */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
