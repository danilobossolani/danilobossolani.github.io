<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover libera as safe areas do iPhone; o CSS usa env(). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://danilobossolani.github.io/" />

    <title>Danilo Bossolani · Desenvolvedor Back-end Júnior</title>
    <meta
      name="description"
      content="Desenvolvedor back-end júnior em Java e Spring Boot com PostgreSQL, também com Node.js e TypeScript. Freelancer desde agosto de 2026. Sorocaba, SP."
    />
    <meta name="author" content="Danilo Yamazaki Bossolani" />

    <!-- A barra do navegador no celular acompanha o tema do site. -->
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-title" content="Danilo Bossolani" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Capa do link compartilhado. As dimensões explícitas evitam que o
         WhatsApp mostre um cartão pequeno enquanto baixa a imagem. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Danilo Bossolani" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://danilobossolani.github.io/" />
    <meta property="og:title" content="Danilo Bossolani · Desenvolvedor Back-end Júnior" />
    <meta
      property="og:description"
      content="Java, Spring Boot, PostgreSQL, Node.js e TypeScript. Projetos, experiência e currículo."
    />
    <meta property="og:image" content="https://danilobossolani.github.io/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Danilo Bossolani, desenvolvedor back-end júnior" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Danilo Bossolani · Desenvolvedor Back-end Júnior" />
    <meta
      name="twitter:description"
      content="Java, Spring Boot, PostgreSQL, Node.js e TypeScript. Projetos, experiência e currículo."
    />
    <meta name="twitter:image" content="https://danilobossolani.github.io/og.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Aplica tema e idioma antes da primeira pintura, para não haver flash.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = t;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', t === 'dark' ? '#0A0A0A' : '#FAF9F7');

          var l = localStorage.getItem('lang');
          if (l !== 'pt' && l !== 'en') {
            l = (navigator.language || 'pt').toLowerCase().startsWith('pt') ? 'pt' : 'en';
          }
          document.documentElement.lang = l === 'pt' ? 'pt-BR' : 'en';
        } catch (e) {
          /* modo privado: segue com o padrão do HTML */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
